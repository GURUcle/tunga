<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tunga — Property crowdfunding for Namibia</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--ink:#13201B;--ink2:#3B4A44;--muted:#6C7A73;
--bg:#FAF9F6;--surface:#FFFFFF;--surface2:#F5F3ED;
--line:#E5E1D7;--line2:#D2CDC0;
--green:#0B5D4A;--green2:#0E7A61;--greensoft:#E7F2EE;
--sand:#A8822A;--sandsoft:#F9F1DE;
--red:#A63A32;--redsoft:#FAEAE8;
--amber:#8F6410;--ambersoft:#FBF0D9;
--r:14px;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
html{-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-0.02em;line-height:1.15}
h1{font-size:46px}
h2{font-size:30px}
h3{font-size:20px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.demo-ribbon{background:var(--ink);color:#E9E5DA;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:7px 12px}
.nav{position:sticky;top:0;z-index:50;background:rgba(250,249,246,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:28px;height:66px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:21px;letter-spacing:.02em}
.brand .mark{width:26px;height:26px;border:1.5px solid var(--green);border-radius:50%;display:grid;place-items:center;font-size:11px;color:var(--green);font-family:var(--sans)}
.navlinks{display:flex;gap:22px;margin-left:8px}
.navlinks a{font-size:14px;color:var(--ink2);padding:4px 0;border-bottom:1.5px solid transparent}
.navlinks a:hover{color:var(--ink);border-color:var(--line2)}
.navlinks a.on{color:var(--green);border-color:var(--green)}
.spacer{flex:1}
.roleswitch{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px}
.roleswitch button{border:0;background:transparent;font-family:var(--sans);font-size:12.5px;color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer}
.roleswitch button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(19,32,27,.08)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--sans);font-size:14px;font-weight:500;border-radius:10px;padding:11px 20px;border:1px solid transparent;cursor:pointer;transition:.15s}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green2)}
.btn-ghost{background:transparent;border-color:var(--line2);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink2)}
.btn-sm{padding:7px 13px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-danger{background:var(--redsoft);color:var(--red);border-color:#EFD3CF}
section{padding:64px 0}
.hero{padding:76px 0 48px}
.eyebrow{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--sand);font-weight:500;margin-bottom:18px}
.hero h1{max-width:760px}
.hero p.lead{font-size:18px;color:var(--ink2);max-width:600px;margin-top:20px}
.hero-cta{display:flex;gap:12px;margin-top:30px}
.statstrip{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:56px}
.statstrip div{padding:22px 0;border-right:1px solid var(--line)}
.statstrip div:last-child{border-right:0}
.statstrip .k{font-family:var(--serif);font-size:26px;color:var(--ink)}
.statstrip .l{font-size:12px;color:var(--muted);margin-top:2px}
.statstrip div:not(:first-child){padding-left:24px}
.warn-banner{border:1px solid #EBD9B4;background:var(--sandsoft);border-radius:var(--r);padding:18px 22px;display:flex;gap:14px;align-items:flex-start}
.warn-banner .ic{width:22px;height:22px;border-radius:50%;background:var(--sand);color:#fff;display:grid;place-items:center;font-size:13px;flex:0 0 22px;margin-top:1px}
.warn-banner p{font-size:13.5px;color:#6B4E12;line-height:1.6}
.warn-banner strong{color:#4A3508}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:.18s}
.card:hover{border-color:var(--line2);box-shadow:0 6px 20px rgba(19,32,27,.06)}
.card-top{height:112px;background:var(--surface2);position:relative;overflow:hidden}
.card-top img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card-top:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(19,32,27,0) 50%,rgba(19,32,27,.32));pointer-events:none}
.card-top .loc{position:absolute;top:12px;left:14px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--green);background:rgba(255,255,255,.9);padding:3px 9px;border-radius:5px;z-index:2}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:52px;align-items:center}
.hero-img img{width:100%;display:block;border-radius:18px;aspect-ratio:4/3;object-fit:cover}
.detail-hero{position:relative;margin:26px 0 10px;border-radius:16px;overflow:hidden}
.detail-hero img{width:100%;height:360px;object-fit:cover;display:block}
.detail-hero .cap{position:absolute;bottom:10px;right:12px;font-size:11px;color:#fff;background:rgba(19,32,27,.58);padding:4px 9px;border-radius:5px;letter-spacing:.04em}
.card-body{padding:18px 20px 20px}
.card-body h3{font-size:19px;margin-bottom:2px}
.card-body .sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.badge{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.detail-grid{display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start}
.grid2.start{align-items:start}
.badge.green{background:var(--greensoft);color:var(--green);border-color:#CFE5DD}
.badge.sand{background:var(--sandsoft);color:var(--sand);border-color:#EBD9B4}
.badge.red{background:var(--redsoft);color:var(--red);border-color:#EFD3CF}
.badge.amber{background:var(--ambersoft);color:var(--amber);border-color:#EBDCB5}
.progress{height:5px;background:var(--surface2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--green);border-radius:99px}
.pmeta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:9px}
.pmeta b{color:var(--ink);font-weight:500}
.raise{font-family:var(--serif);font-size:19px;margin-top:12px}
.raise span{font-family:var(--sans);font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:26px;overflow-x:auto}
.tabs button{background:0;border:0;border-bottom:2px solid transparent;padding:0 0 12px;font-family:var(--sans);font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--green)}
.prose h3{margin:26px 0 10px}
.prose h3:first-child{margin-top:0}
.prose p{color:var(--ink2);margin-bottom:12px;font-size:14.5px}
.prose ul{margin:0 0 14px 18px;color:var(--ink2);font-size:14.5px}
.prose li{margin-bottom:6px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
.kv div{padding:13px 16px;border-bottom:1px solid var(--line);font-size:13.5px}
.kv div:nth-child(odd){background:var(--surface2);color:var(--muted);width:52%}
.kv div:nth-child(even){font-weight:500}
.kv div:nth-last-child(-n+2){border-bottom:0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:13px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.sticky{position:sticky;top:88px}
.invest-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.invest-card .big{font-family:var(--serif);font-size:32px;line-height:1.1}
.invest-card .of{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.rows{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.rows:last-of-type{border-bottom:0}
.rows span:first-child{color:var(--muted)}
.rows span:last-child{font-weight:500}
.modal-bg{position:fixed;inset:0;background:rgba(19,32,27,.42);z-index:100;display:grid;place-items:center;padding:24px;overflow-y:auto}
.modal{background:var(--surface);border-radius:18px;max-width:560px;width:100%;padding:28px;position:relative;max-height:90vh;overflow-y:auto}
.modal h3{font-size:23px;margin-bottom:4px}
.modal .close{position:absolute;top:18px;right:18px;background:0;border:0;font-size:20px;color:var(--muted);cursor:pointer;line-height:1}
.stepper{display:flex;gap:6px;margin:18px 0 24px}
.stepper i{flex:1;height:3px;background:var(--line);border-radius:99px}
.stepper i.on{background:var(--green)}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;font-family:var(--sans);font-size:15px;padding:11px 13px;border:1px solid var(--line2);border-radius:9px;background:var(--surface);color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--greensoft);border-color:var(--green)}
.chips{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.chips button{font-size:12.5px;padding:6px 12px;border-radius:99px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;color:var(--ink2)}
.chips button:hover{border-color:var(--green);color:var(--green)}
.check{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink2);cursor:pointer}
.check:last-of-type{border-bottom:0}
.check input{margin-top:3px;accent-color:var(--green);width:16px;height:16px;flex:0 0 16px}
.notice{border-radius:9px;padding:12px 14px;font-size:13px;line-height:1.55;margin-bottom:14px}
.notice.info{background:var(--greensoft);color:#0A4A3B}
.notice.err{background:var(--redsoft);color:var(--red)}
.notice.warn{background:var(--ambersoft);color:var(--amber)}
.clock{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-variant-numeric:tabular-nums}
.clock .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.clock.urgent .dot{background:var(--red)}
.clock.soon .dot{background:var(--sand)}
.stepline{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:14px;padding-bottom:20px;position:relative}
.step:last-child{padding-bottom:0}
.step .bullet{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:11px;color:var(--muted);flex:0 0 22px;background:var(--surface);z-index:1}
.step.done .bullet{background:var(--green);border-color:var(--green);color:#fff}
.step.now .bullet{border-color:var(--green);color:var(--green);box-shadow:0 0 0 4px var(--greensoft)}
.step:not(:last-child):after{content:"";position:absolute;left:10.5px;top:22px;bottom:0;width:1px;background:var(--line)}
.step .st{font-size:14px;font-weight:500}
.step .sd{font-size:12.5px;color:var(--muted)}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.kpi .k{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi .k .v{font-family:var(--serif);font-size:24px;line-height:1.2}
.kpi .k .l{font-size:11.5px;color:var(--muted);margin-top:3px;letter-spacing:.03em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;margin-bottom:22px}
.panel h3{font-size:18px;margin-bottom:4px}
.panel .desc{font-size:13px;color:var(--muted);margin-bottom:18px}
footer{border-top:1px solid var(--line);padding:40px 0 60px;margin-top:40px;font-size:12.5px;color:var(--muted)}
footer .cols{display:grid;grid-template-columns:2fr 1fr 1fr;gap:40px;margin-bottom:28px}
footer h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-bottom:10px;font-weight:500}
footer a{display:block;padding:3px 0}
footer a:hover{color:var(--ink)}
.rule{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:18px;line-height:1.7}
.hide{display:none!important}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:16px}
@media(max-width:900px){
h1{font-size:34px}h2{font-size:25px}
.grid3,.grid2,.detail-grid,.hero-grid{grid-template-columns:1fr}
.hero-grid{gap:32px}
.detail-hero img{height:220px}
.statstrip{grid-template-columns:1fr 1fr}
.statstrip div{border-right:0;border-bottom:1px solid var(--line);padding-left:0!important}
.kpi{grid-template-columns:1fr 1fr}
.navlinks{display:none}
footer .cols{grid-template-columns:1fr}
}
</style>
</head>

const KEY = 'tunga.v2';
let S;
try {
  const raw = localStorage.getItem(KEY);
  S = raw ? JSON.parse(raw) : seed();
} catch(e){ S = seed(); }
if(!S || !S.offerings || !S.offerings.length || !S.offerings[0].img || !S.subs) S = seed();
try { localStorage.removeItem('tunga.v1'); } catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- helpers ---------- */
const me = () => S.investors[0];
const off = id => S.offerings.find(o=>o.id===id);
const inv = id => S.investors.find(i=>i.id===id);
const pct = o => Math.min(1, o.raised / o.target);
const daysLeft = o => o.closesAt ? Math.max(0, Math.ceil((o.closesAt - now())/D)) : 0;
const capFor = u => u.classification === 'retail' ? Math.min(u.netWorth*0.10, 100000) : u.netWorth*0.10;
const capLeft = u => Math.max(0, capFor(u) - u.ytd);
const fmtDate = ts => new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});

function audit(what, who){
  S.audit.unshift({at:now(), who:who||'Investor', what});
  save();
}

function feeModel(o){
  const raised = o.target;
  const price = o.property.value;
  const rent = (o.projections[0] && o.projections[0].revenue) || 0;
  const exitValue = price * 1.25;
  return {
    raised:raised, price:price, rent:rent, exitValue:exitValue,
    platform: raised * 0.01,
    structure: raised * 0.01,
    sourcing: price * 0.02,
    mgmt: rent * 0.08,
    disposal: exitValue * 0.01,
    oneOff: raised * 0.02 + price * 0.02
  };
}

function feesBody(o){
  const m = feeModel(o);
  const ex = 50000;
  const share = ex / o.target;
  const oneOffShare = m.oneOff * share;
  const mgmtShare = m.mgmt * 8.5 * share;
  const disposalShare = m.disposal * share;
  const total = oneOffShare + mgmtShare + disposalShare;
  const pct = total / ex;

  const row = (a,b,c,d,e) => '<tr><td>'+a+'</td><td style="font-size:13px;color:var(--muted)">'+b+'</td><td class="num">'+c+'</td><td style="font-size:13px;color:var(--muted)">'+d+'</td><td style="font-size:12px">'+(e?'<span class="badge amber">Related</span>':'<span class="badge">Third party</span>')+'</td></tr>';

  return '<div class="notice info">Every fee charged in this offering, who receives it, and what it costs you. Nothing here is buried in an annexure.</div>'+
    '<h3>Fees paid to the platform and related parties</h3>'+
    '<table><thead><tr><th>Fee</th><th>Basis</th><th class="num">Amount</th><th>Timing</th><th>Status</th></tr></thead><tbody>'+
    row('Platform fee','1.0% of funds raised',NS(m.platform),'On close',1)+
    row('Structuring and arrangement','1.0% of funds raised',NS(m.structure),'On close',1)+
    row('Sourcing commission','2.0% of purchase price',NS(m.sourcing),'At acquisition',1)+
    row('Property management','8.0% of rent collected',NS(m.mgmt)+' a year','Quarterly',1)+
    row('Disposal fee','1.0% of sale price',NS(m.disposal),'At exit',1)+
    row('Promote','20% of profit above an 8% preferred return','Variable','At exit',1)+
    '</tbody></table>'+
    '<div class="notice warn mt16"><strong>One-off fees total '+NS(m.oneOff)+'</strong> — that is '+(m.oneOff/m.raised*100).toFixed(1)+'% of the entire amount being raised, taken before a single rand of rent is collected.</div>'+
    '<h3>Third-party transaction costs</h3>'+
    '<p>Transfer duty, conveyancing and registration come to approximately N$1,450,000. These are already included in the use-of-funds table and are paid to the Receiver of Revenue and the conveyancer, not to us.</p>'+
    '<h3>What this costs a N$50,000 investment</h3>'+
    '<div class="kv">'+
      '<div>Your share of the raise</div><div>'+(share*100).toFixed(3)+'%</div>'+
      '<div>One-off fees attributable to you</div><div>'+NS(oneOffShare)+'</div>'+
      '<div>Property management over 7 years</div><div>'+NS(mgmtShare)+'</div>'+
      '<div>Disposal fee at exit</div><div>'+NS(disposalShare)+'</div>'+
      '<div>Total fees over the full term</div><div>'+NS(total)+'</div>'+
      '<div>As a share of your investment</div><div style="color:var(--red)">'+(pct*100).toFixed(1)+'%</div>'+
    '</div>'+
    '<div style="display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface2);margin:6px 0 8px">'+
      '<i style="width:'+((1-pct)*100).toFixed(0)+'%;background:var(--green)"></i>'+
      '<i style="width:'+(pct*100).toFixed(0)+'%;background:var(--sand)"></i>'+
    '</div>'+
    '<p style="font-size:12.5px;color:var(--muted)">Green is capital that stays working for you. Sand is fees.</p>'+
    '<div class="notice warn">In practice this means the building has to appreciate by roughly '+(pct*100).toFixed(0)+'% over seven years before these fees are recovered and you are ahead. That is before inflation, and before any shortfall in rent.</div>'+
    '<h3>Related party disclosure</h3>'+
    '<p>The sourcing commission and the property management fee are paid to the sponsor\'s estate agency. The platform fee and structuring fee are paid to the platform operator. The sponsor is a director of the issuer and holds equity in it. These relationships are disclosed in section 8 of the offering document and are approved by the platform\'s independent non-executive director, who holds no economic interest in this offering.</p>'+
    '<h3>How this compares</h3>'+
    '<p>A listed Namibian property fund typically charges under 1% a year, with no sourcing commission, no disposal fee and no promote. You are paying more here because you are buying a single building directly rather than a share of a large diversified portfolio — and because the work of finding, structuring and managing that one building has to be paid for by that one building.</p>'+
    '<h3>If the deal underperforms</h3>'+
    '<p>Fees are paid at fixed points and are not reduced if the property performs badly. A disposal fee is only charged if there is a sale, and the promote only applies above the 8% preferred return. But the platform, structuring, sourcing and management fees are earned regardless of your outcome. You bear the downside; we are paid either way.</p>';
}

/* ---------- invest flow ---------- */
function openInvest(id){
  S.modal = {type:'invest', offeringId:id, step:1, amount:0, classification:me().classification, netWorth:me().netWorth, acks:{a:false,b:false,c:false,d:false}, error:''};
  renderModal();
}
function closeModal(){ S.modal=null; document.getElementById('modal-root').innerHTML=''; }

function modalErr(){ const m=S.modal; return m.error?'<div class="notice err">'+m.error+'</div>':''; }

function renderModal(){
  const m = S.modal;
  if(!m){ document.getElementById('modal-root').innerHTML=''; return; }
  const o = off(m.offeringId);
  let body='';
  if(m.step===1){
    const u = {...me(), classification:m.classification, netWorth:m.netWorth, ytd:me().ytd};
    const left = capLeft(u);
    const remainingValue = o.target - o.raised;
    body =
      '<h3>Invest in '+o.title+'</h3>'+
      '<p style="font-size:13px;color:var(--muted)">'+NS(o.unitPrice)+' per unit &middot; minimum '+NS(o.minTicket)+'</p>'+
      '<div class="stepper"><i class="on"></i><i></i><i></i></div>'+
      modalErr()+
      '<div class="notice info">Your remaining allowance under the investor limit is <strong>'+NS(left)+'</strong> for this 12-month period.</div>'+
      '<div class="field"><label>Amount to invest (N$)</label><input id="amt" type="number" min="'+o.minTicket+'" step="1000" value="'+(m.amount||o.minTicket)+'" oninput="setAmount(this.value)"></div>'+
      '<div class="chips"><button onclick="quick('+o.minTicket+')">'+NS(o.minTicket)+'</button><button onclick="quick(25000)">N$25,000</button><button onclick="quick(50000)">N$50,000</button><button onclick="quick('+Math.floor(left)+')">Max allowed</button></div>'+
      '<div class="rows mt24"><span>Units purchased</span><span id="su">'+(m.amount/o.unitPrice).toFixed(2)+'</span></div>'+
      '<div class="rows"><span>Ownership of SPV</span><span id="so">'+(m.amount/o.target*100).toFixed(3)+'%</span></div>'+
      '<div class="rows"><span>Projected annual distribution</span><span id="sd">'+NS(m.amount*o.projected)+'</span></div>'+
      '<div class="between mt24"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="step1()">Continue</button></div>';
  } else if(m.step===2){
    body =
      '<h3>Eligibility and risk acknowledgement</h3>'+
      '<p style="font-size:13px;color:var(--muted)">Sections 11, 34 and 35 of the Guidelines.</p>'+
      '<div class="stepper"><i class="on"></i><i class="on"></i><i></i></div>'+
      modalErr()+
      '<div class="field"><label>Investor category</label><select onchange="setClass(this.value)">'+
        '<option value="retail"'+(m.classification==='retail'?' selected':'')+'>Retail investor</option>'+
        '<option value="sophisticated"'+(m.classification==='sophisticated'?' selected':'')+'>Sophisticated investor</option>'+
        '<option value="hnwi"'+(m.classification==='hnwi'?' selected':'')+'>High net worth individual</option>'+
      '</select></div>'+
      '<div class="field"><label>Declared net worth, excluding pension and primary residence (N$)</label><input type="number" value="'+m.netWorth+'" oninput="setNW(this.value)"></div>'+
      '<div class="notice '+(capLeft({...me(),classification:m.classification,netWorth:m.netWorth})>=m.amount?'info':'err')+'">Limit for this category: <strong>'+NS(capFor({classification:m.classification,netWorth:m.netWorth}))+'</strong> per year'+(m.classification==='retail'?' (lesser of 10% of net worth or N$100,000)':' (10% of net worth)')+'.</div>'+
      '<div style="font-size:13px;color:var(--ink2);margin:18px 0 4px">I confirm that:</div>'+
      chk('a','I understand this is a risky investment.')+
      chk('b','I can absorb the complete loss of the amount I am investing.')+
      chk('c','I understand I may not be able to sell these securities, and may be locked in for years.')+
      chk('d','I have been given the disclosures for this offer and have read the risk warnings.')+
      '<div class="between mt24"><button class="btn btn-ghost" onclick="stepBack()">Back</button><button class="btn btn-primary" onclick="step2()">Continue</button></div>';
  } else if(m.step===3){
    body =
      '<h3>Confirm your subscription</h3>'+
      '<p style="font-size:13px;color:var(--muted)">Check the details before you commit.</p>'+
      '<div class="stepper"><i class="on"></i><i class="on"></i><i class="on"></i></div>'+
      '<div class="kv">'+
        '<div>Offering</div><div>'+o.title+'</div>'+
        '<div>Instrument</div><div>'+(o.type==='equity'?'Ordinary shares':'Secured note')+'</div>'+
        '<div>Amount</div><div>'+NS(m.amount)+'</div>'+
        '<div>Units</div><div>'+(m.amount/o.unitPrice).toFixed(2)+'</div>'+
        '<div>Custodian</div><div>Bank Windhoek Nominees (illustrative)</div>'+
        '<div>Investor category</div><div>'+({retail:'Retail',sophisticated:'Sophisticated',hnwi:'High net worth'})[m.classification]+'</div>'+
      '</div>'+
      '<div class="notice warn">You have <strong>48 hours</strong> from the moment you confirm to withdraw without restriction. After the offer closes, you cannot cancel.</div>'+
      '<div class="between mt24"><button class="btn btn-ghost" onclick="stepBack()">Back</button><button class="btn btn-primary" onclick="confirmSub()">Confirm subscription</button></div>';

    const sub = S.subs.find(s=>s.id===m.subId);
    body =
      '<h3>Subscription received</h3>'+
      '<p style="font-size:13.5px;color:var(--ink2);margin-top:6px">'+NS(sub.amount)+' allocated to '+o.title+'. Your money is held in a segregated trust account at the custodian bank until the round closes.</p>'+
      '<div class="notice info mt16"><strong>Cooling-off:</strong> you can cancel without restriction for the next 48 hours. After that your subscription is binding until the round closes.</div>'+

  }
  document.getElementById('modal-root').innerHTML =
    '<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="close" onclick="closeModal()">&times;</button>'+body+'</div></div>';

function chk(k,label){
  const m=S.modal;
  return '<label class="check"><input type="checkbox" '+(m.acks[k]?'checked':'')+' onchange="setAck(\''+k+'\',this.checked)"><span>'+label+'</span></label>';
}
function setAck(k,v){ S.modal.acks[k]=v; }
function setAmount(v){ S.modal.amount = Number(v)||0; updSummary(); }
function updSummary(){
  const m=S.modal; if(!m) return;
  const o=off(m.offeringId);
  const su=document.getElementById('su'); if(!su) return;
  su.textContent=(m.amount/o.unitPrice).toFixed(2);
  document.getElementById('so').textContent=(m.amount/o.target*100).toFixed(3)+'%';
  document.getElementById('sd').textContent=NS(m.amount*o.projected);
}
function quick(v){ S.modal.amount = Math.max(0,v); renderModal(); }
function setClass(v){ S.modal.classification=v; renderModal(); }
function setNW(v){ S.modal.netWorth=Number(v)||0; }
function stepBack(){ S.modal.step--; S.modal.error=''; renderModal(); }

function step1(){
  const m=S.modal, o=off(m.offeringId);
  const u={...me(), classification:m.classification, netWorth:m.netWorth};
  if(!m.amount || m.amount < o.minTicket){ m.error='The minimum subscription for this offering is '+NS(o.minTicket)+'.'; return renderModal(); }
  if(m.amount > capLeft(u)){ m.error='This exceeds your remaining allowance of '+NS(capLeft(u))+' for the 12-month period. Section 11 caps your total annual investment.'; return renderModal(); }
  if(m.amount > o.target - o.raised){ m.error='Only '+NS(o.target-o.raised)+' of the target remains. Subscriptions above this are rejected under section 17.'; return renderModal(); }
  m.error=''; m.step=2; renderModal();
}
function step2(){
  const m=S.modal;
  if(!(m.acks.a&&m.acks.b&&m.acks.c&&m.acks.d)){ m.error='All four acknowledgements are required before you can invest (section 35).'; return renderModal(); }
  m.error=''; m.step=3; renderModal();
}
function confirmSub(){
  const m=S.modal, o=off(m.offeringId), u=me();
  const id='s'+(S.subs.length+1);
  S.subs.push({id, offeringId:o.id, investorId:u.id, amount:m.amount, units:m.amount/o.unitPrice, status:'cooling', createdAt:now(), settledAt:null});
  o.raised += m.amount;
  u.ytd += m.amount;
  u.classification = m.classification;
  u.netWorth = m.netWorth;
  audit('Subscription of '+NS(m.amount)+' in '+o.title+'. Cooling-off until '+new Date(now()+2*D).toLocaleString('en-GB')+'.');
  m.step=4; m.subId=id; save(); renderModal(); render();
}

/* ---------- portfolio ---------- */
function renderPortfolio(){
  const u = me();
  const mine = S.subs.filter(s=>s.investorId===u.id);
  const confirmed = mine.filter(s=>s.status==='confirmed');
  const invested = confirmed.reduce((a,s)=>a+s.amount,0);
  const cooling = mine.filter(s=>s.status==='cooling');
  const received = confirmed.reduce((a,s)=>a+(s.distributions||0),0);
  const valueChange = confirmed.reduce((a,s)=>a+(s.valueChange||0),0);
  const valueNow = invested + valueChange;
  const totalRet = invested ? (received + valueChange)/invested : 0;
  const since = confirmed.length ? Math.min.apply(null, confirmed.map(s=>s.createdAt)) : null;
  return '<div class="wrap"><section style="padding-top:40px">'+
    '<div class="between" style="align-items:flex-start">'+
      '<div><h1 style="font-size:36px">My portfolio</h1>'+
      '<p style="color:var(--muted);margin-top:6px">'+u.name+' &middot; '+({retail:'Retail investor',sophisticated:'Sophisticated investor',hnwi:'High net worth individual'})[u.classification]+' &middot; <span class="badge">'+NS(capLeft(u))+' allowance left this year</span></p></div>'+
      '<button class="btn btn-ghost btn-sm" onclick="resetDemo()">Reset demo data</button>'+
    '</div>'+
    '<div class="kpi mt32">'+
      '<div class="k"><div class="v">'+NS(invested)+'</div><div class="l">Invested</div></div>'+
      '<div class="k"><div class="v">'+NS(received)+'</div><div class="l">Distributions received</div></div>'+
      '<div class="k"><div class="v">'+NS(valueNow)+'</div><div class="l">Current value</div></div>'+
      '<div class="k"><div class="v" style="color:'+(totalRet>=0?'var(--green)':'var(--red)')+'">'+(totalRet>=0?'+':'')+(totalRet*100).toFixed(1)+'%</div><div class="l">Total return'+(since?' since '+new Date(since).toLocaleDateString('en-GB',{month:'short',year:'numeric'}):'')+'</div></div>'+
    '</div>'+
    (cooling.length?'<div class="panel"><h3>Cooling-off period</h3><div class="desc">Section 22 — you may cancel without restriction within 48 hours of subscribing.</div>'+
      cooling.map(s=>{
        const o=off(s.offeringId); const left=(s.createdAt+2*D)-now();
        const h=Math.max(0,Math.floor(left/3600000)); const mn=Math.max(0,Math.floor((left%3600000)/60000));
        const expired = left<=0;
        return '<div class="between" style="padding:14px 0;border-bottom:1px solid var(--line)">'+
          '<div><div style="font-size:14px;font-weight:500">'+o.title+'</div><div style="font-size:12.5px;color:var(--muted)">'+NS(s.amount)+' &middot; '+(expired?'cooling-off ended':'expires '+new Date(s.createdAt+2*D).toLocaleString('en-GB'))+'</div></div>'+
          '<div class="row">'+(expired
            ? '<span class="badge">Binding until close</span>'
            : '<span class="clock soon"><span class="dot"></span>'+h+'h '+mn+'m left</span><button class="btn btn-danger btn-sm" onclick="cancelSub(\''+s.id+'\')">Cancel</button>')+
          '</div>'+
        '</div>';
      }).join('')+'</div>':'')+
    '<div class="panel"><h3>What your holdings have earned</h3><div class="desc">Distributions actually paid to you, plus the change in value since the last independent valuation.</div>'+
      (confirmed.length?'<table><thead><tr><th>Offering</th><th class="num">Invested</th><th class="num">Received</th><th class="num">Value change</th><th class="num">Value now</th><th class="num">Return</th></tr></thead><tbody>'+
      confirmed.map(s=>{
        const o=off(s.offeringId);
        const r=s.distributions||0, vc=s.valueChange||0;
        const ret=(r+vc)/s.amount;
        return '<tr><td>'+o.title+'<div style="font-size:12px;color:var(--muted)">'+o.place+' &middot; '+o.property.units+' units &middot; '+(s.nextDist?'next distribution '+fmtDate(s.nextDist):'next distribution to be announced')+'</div></td>'+
          '<td class="num">'+NS(s.amount)+'</td>'+
          '<td class="num">'+NS(r)+'</td>'+
          '<td class="num" style="color:'+(vc>=0?'var(--green)':'var(--red)')+'">'+(vc>=0?'+':'')+NS(vc)+'</td>'+
          '<td class="num">'+NS(s.amount+vc)+'</td>'+
          '<td class="num" style="color:'+(ret>=0?'var(--green)':'var(--red)')+'">'+(ret>=0?'+':'')+(ret*100).toFixed(1)+'%</td></tr>';
      }).join('')+
      '</tbody></table>':'<p style="font-size:13.5px;color:var(--muted)">No holdings yet.</p>')+
      '<p style="font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6">Valuations are carried out by an independent professional every 12 months and are estimates, not prices you are guaranteed to achieve. Past performance does not indicate future results. Distributions are not guaranteed and may be reduced or suspended if the property underperforms.</p>'+
    '</div>'+
    '<div class="panel"><h3>Activity</h3><div class="desc">Every action on your account is logged for seven years, as required by section 46(5).</div>'+
      '<table><tbody>'+S.audit.slice(0,8).map(a=>'<tr><td style="width:120px;color:var(--muted);font-size:12.5px">'+fmtDate(a.at)+'</td><td>'+a.what+'</td></tr>').join('')+'</tbody></table>'+
    '</div>'+
  '</section></div>';
}

function cancelSub(id){
  const s = S.subs.find(x=>x.id===id); if(!s) return;
  if(now() > s.createdAt + 2*D){ alert('The 48-hour cooling-off period has expired. This subscription can no longer be cancelled.'); return; }
  s.status='cancelled';
  const o=off(s.offeringId); o.raised -= s.amount;
  const u=me(); u.ytd -= s.amount;
  audit('Subscription '+NS(s.amount)+' in '+o.title+' cancelled within cooling-off. Refund instructed to custodian within 48 hours.');
  save(); render();
}

function stepRow(cls,t,d){ return '<div class="step '+cls+'"><div class="bullet">'+(cls==='done'?'&#10003;':'')+'</div><div><div class="st">'+t+'</div><div class="sd">'+d+'</div></div></div>'; }

function postUpdate(){
  const el = document.getElementById('upd');
  if(!el.value.trim()) return;
  const k = S.offerings.find(x=>x.id==='khomasdal');
  k.updates.unshift({date:now(), title:'Quarterly update', body:el.value.trim()});
  audit('Issuer published a quarterly update for Khomasdal Ridge.');
  el.value=''; save(); render();
}

function setConsoleTab(t){ S.consoleTab=t; render(); }

        const elapsed = Math.floor((now()-(o.submittedAt||now()))/D);
        const left = 90-elapsed;
        return '<div style="padding:16px 0;border-bottom:1px solid var(--line)">'+
          '<div class="between"><div><div style="font-size:15px;font-weight:500">'+o.title+'</div><div style="font-size:12.5px;color:var(--muted)">'+o.spv+' &middot; target '+NS(o.target)+'</div></div>'+
          '<div class="row"><span class="clock '+(left<15?'urgent':'soon')+'"><span class="dot"></span>'+left+' days left</span>'+
          (o.status==='review'?'<button class="btn btn-primary btn-sm" onclick="approve(\''+o.id+'\')">Approve &amp; publish</button>':'<button class="btn btn-ghost btn-sm" onclick="closeRound(\''+o.id+'\')">Close round</button>')+
          '</div></div>'+
          '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">'+

            '<span class="badge green">Directors fit &amp; proper</span>'+
            '<span class="badge green">FIA screening clear</span>'+

          '</div></div>';

    '</div>'+
    '<div class="panel"><h3>Demo controls</h3><div class="desc">Shortcuts to move the prototype through its states.</div>'+
      '<div class="row" style="flex-wrap:wrap;gap:10px">'+
        '<button class="btn btn-ghost btn-sm" onclick="settleAll()">Settle all cooling-off periods</button>'+

        '<button class="btn btn-ghost btn-sm" onclick="closeRound(\'vineta\')">Close Vineta round</button>'+
        '<button class="btn btn-ghost btn-sm" onclick="resetDemo()">Reset demo data</button>'+
      '</div></div>';
  }
  if(tab==='clocks'){
    const rows = [];

      if(o.status==='review'){

      }
      if(o.status==='closed'&&o.closedAt){
        const due = o.closedAt + 90*D;

      }
    });

    rows.push(['Platform','Audited financial statements','3 months after year end',96,'days']);
    return '<div class="panel"><h3>Statutory deadline board</h3><div class="desc">Every clock the Guidelines impose, computed from live timestamps.</div>'+
      '<table><thead><tr><th>Entity</th><th>Obligation</th><th>Rule</th><th class="num">Time left</th></tr></thead><tbody>'+
      rows.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td style="color:var(--muted);font-size:13px">'+r[2]+'</td><td class="num"><span class="clock '+(r[3]<10?'urgent':r[3]<30?'soon':'')+'"><span class="dot"></span>'+r[3]+' '+r[4]+'</span></td></tr>').join('')+
      '</tbody></table></div>';

  if(tab==='caps'){
    return '<div class="panel"><h3>Investor concentration limits</h3><div class="desc">Section 11 — retail capped at the lesser of 10% of net worth or N$100,000 per year; sophisticated and HNWI at 10% of net worth.</div>'+
      '<table><thead><tr><th>Investor</th><th>Category</th><th class="num">Net worth</th><th class="num">Annual limit</th><th class="num">Invested</th><th>Utilisation</th></tr></thead><tbody>'+
      S.investors.map(i=>{
        const cap = capFor(i); const u = Math.min(1, i.ytd/cap);
        return '<tr><td>'+i.name+'<div style="font-size:12px;color:var(--muted)">'+i.email+'</div></td><td><span class="badge">'+({retail:'Retail',sophisticated:'Sophisticated',hnwi:'HNWI'})[i.classification]+'</span></td><td class="num">'+NS(i.netWorth)+'</td><td class="num">'+NS(cap)+'</td><td class="num">'+NS(i.ytd)+'</td>'+

      '</tbody></table></div>';
  }
  return '<div class="panel"><h3>Quarterly return to NAMFISA</h3><div class="desc">Section 47(1) — the eight data points the operator must report every quarter.</div>'+
    '<table><thead><tr><th>Required item</th><th>Source</th><th class="num">Value</th></tr></thead><tbody>'+
    [['Issuers and amounts raised','Offerings table',NS(S.offerings.reduce((a,o)=>a+o.raised,0))],
     ['Investors per category','Investor register',S.investors.length+' across 3 categories'],
     ['Investor profiles and trends','KYC records','Median ticket N$88,000'],
     ['Types of instrument used','Offering records','2 equity, 1 debt, 1 closed'],
     ['Risk incidents and breaches','Incident log','0 open'],
     ['Unresolved complaints','Complaints register','0 open'],
     ['Unsuccessful issuances','Round history','0 to date'],
     ['Management accounts','Finance','Attached']]
    .map(r=>'<tr><td>'+r[0]+'</td><td style="font-size:13px;color:var(--muted)">'+r[1]+'</td><td class="num">'+r[2]+'</td></tr>').join('')+
    '</tbody></table>'+
    '<button class="btn btn-primary mt24" onclick="exportReport()">Export quarterly return (JSON)</button>'+
    '<button class="btn btn-ghost mt24" style="margin-left:8px" onclick="exportCSV()">Export investor register (CSV)</button></div>';
}

function approve(id){
  const o = off(id); if(!o) return;
  o.status='live'; o.approvedAt=now(); o.openedAt=now(); o.closesAt=now()+60*D;
  S.filings.push({id:'f'+S.filings.length+1, offeringId:id, type:'Offering document to NAMFISA', submittedAt:now(), note:'Filed 48 hours before publication (s13(1))'});
  audit('Compliance approved and published '+o.title+'. Round opens for a maximum of 60 days.','Compliance');
  save(); render();
}
function closeRound(id){
  const o = off(id); if(!o||o.status!=='live') return;
  o.status='closed'; o.closedAt=now();
  if(o.raised >= o.target){
    audit('Round closed at target for '+o.title+'. '+NS(o.raised)+' released to issuer within five business days (s21).','Compliance');
    S.subs.filter(s=>s.offeringId===id&&s.status==='cooling').forEach(s=>s.status='confirmed');
  } else {
    const refunded = S.subs.filter(s=>s.offeringId===id).reduce((a,s)=>a+s.amount,0);
    S.subs.filter(s=>s.offeringId===id).forEach(s=>s.status='refunded');
    audit('Round for '+o.title+' failed to reach target. '+NS(refunded)+' refunded within 48 hours (s18).','Compliance');
  }
  save(); render();
}
function settleAll(){
  S.subs.filter(s=>s.status==='cooling').forEach(s=>{s.status='confirmed'; s.settledAt=now();});
  audit('Cooling-off periods expired; subscriptions confirmed.','Compliance');
  save(); render();
}
function resetDemo(){ localStorage.removeItem(KEY); S=seed(); save(); location.hash='#/'; render(); }

function download(name, text, type){
  const b = new Blob([text], {type:type||'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; a.click();
}
function exportReport(){
  const rep = {
    report:'NAMFISA quarterly return — s47(1)',
    operator:'Tunga Crowdfunding (Pty) Ltd',
    period:'Q4 2026',
    generated:new Date().toISOString(),
    issuers:S.offerings.map(o=>({spv:o.spv, registration:o.regNo, instrument:o.type, target:o.target, raised:o.raised, status:o.status})),
    investorsByCategory:S.investors.reduce((a,i)=>{a[i.classification]=(a[i.classification]||0)+1;return a;},{}) ,
    instruments:['equity','debt'],
    riskIncidents:[],
    unresolvedComplaints:[],
    unsuccessfulIssuances:S.offerings.filter(o=>o.status==='closed'&&o.raised<o.target).length,
    totalRaised:S.offerings.reduce((a,o)=>a+o.raised,0)
  };
  download('tunga-namfisa-q4-2026.json', JSON.stringify(rep,null,2));
}
function exportCSV(){
  const rows = [['name','email','category','net_worth','annual_limit','ytd_invested']];
  S.investors.forEach(i=>rows.push([i.name,i.email,i.classification,i.netWorth,capFor(i),i.ytd]));
  download('tunga-investor-register.csv', rows.map(r=>r.join(',')).join('\n'), 'text/csv');
}

/* ---------- router ---------- */
function render(){
  renderNav(); renderFoot();
  const app = document.getElementById('app');
  let h = location.hash || '#/';
  h = h.replace(/\/+$/, '') || '#/';
  try {
    if(h.indexOf('#/offering/') === 0) app.innerHTML = renderOffering(h.split('/')[2]);
    else if(h === '#/portfolio') app.innerHTML = renderPortfolio();
    else if(h === '#/issuer') app.innerHTML = renderIssuer();
    else if(h === '#/console') app.innerHTML = renderConsole();
    else if(h === '#/rulebook') app.innerHTML = renderRulebook();
    else app.innerHTML = renderHome();
  } catch(err){
    app.innerHTML = '<div class="wrap"><section><div class="notice err"><strong>This page failed to render.</strong><br>'+
      (err && err.message ? err.message : 'Unknown error')+'</div>'+
      '<p style="font-size:13px;color:var(--muted)">Route: '+h+'</p>'+
      '<button class="btn btn-ghost btn-sm" onclick="resetDemo()">Reset demo data and reload</button></section></div>';
    if(window.console) console.error(err);
  }
  if(S.modal) renderModal();
  try { window.scrollTo(0,0); } catch(e){}
}

window.addEventListener('hashchange', render);
render();
setInterval(()=>{ if(S.modal && S.modal.step===4) return; if(location.hash==='#/portfolio') render(); }, 30000);
</script>
